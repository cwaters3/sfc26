    if (v) {
      played++; last = start + i;
      if (v === 'D') D++; else if (v === 'L') L++; else H++;
    }
  }
  const lead = D - L;
  const remaining = 9 - played;
  const clinched = remaining > 0 && Math.abs(lead) > remaining;
  const final = played === 9 || clinched;
  const winner = lead > 0 ? 'D' : lead < 0 ? 'L' : null;
  let pD = 0, pL = 0;
  if (final) {
    if (winner === 'D') pD = 1;
    else if (winner === 'L') pL = 1;
    else { pD = 0.5; pL = 0.5; }
  }
  return { D, L, H, played, last, lead, remaining, clinched, final, winner, pD, pL };
}
function liveText(t) {
  if (!t.played) return 'Not started';
  if (t.lead === 0) return 'All square thru ' + t.last;
  return NAMES[t.winner] + ' ' + Math.abs(t.lead) + ' UP thru ' + t.last;
}
function statusText(t) {
  if (!t.played) return 'Not started';
  if (!t.final) return liveText(t);
  if (!t.winner) return 'All square · Final · ½ pt each';
  const lead = Math.abs(t.lead);
  return t.remaining > 0
    ? NAMES[t.winner] + ' win ' + lead + '&' + t.remaining + ' · +1 pt'
    : NAMES[t.winner] + ' ' + lead + ' UP · Final · +1 pt';
}
function tallyLine(t) {
  if (!t.played) return 'Not started';
  if (t.final && t.winner && t.remaining > 0) return NAMES[t.winner] + ' win ' + Math.abs(t.lead) + '&' + t.remaining;
  if (t.final && t.played === 9) return t.winner ? NAMES[t.winner] + ' ' + Math.abs(t.lead) + ' UP · Final' : 'All square · Final';
  return liveText(t);
}
function totals(resultsByMatch) {
  let D = 0, L = 0, played = 0;
  MATCHES.forEach((m) => {
    const holes = holesOf(resultsByMatch[m.id]);
    [0, 1].forEach((nine) => {
      const t = tallyNine(holes, nine);
      D += t.pD; L += t.pL; played += t.played;
    });
  });
  return { D, L, played, decided: D + L };
}
function overallBanner(tot) {
  if (tot.D > 3) return 'The Dolphins have clinched the trophy.';
  if (tot.L > 3) return 'The Long-Teens have clinched the trophy.';
  if (tot.decided === 6) return 'Tied 3–3. Saturday evening at the Skeist Par 3 decides it.';
  return '';
}
function fmtPts(n) { return Number.isInteger(n) ? String(n) : n.toFixed(1); }
function daysUntil(now) {
  const f = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit' });
  const [ty, tm, td] = f.format(now).split('-').map(Number);
  const [ey, em, ed] = CONFIG.eventDate.split('-').map(Number);
  return Math.round((Date.UTC(ey, em - 1, ed) - Date.UTC(ty, tm - 1, td)) / 86400000);
}
function countdown(now) {
  const days = daysUntil(now);
  if (days > 1) return { big: String(days), label: 'days to go' };
  if (days === 1) return { big: '1', label: 'day to go' };
  if (days === 0) {
    const ms = Date.parse(CONFIG.teeOff) - now.getTime();
    if (ms > 0) { const h = Math.ceil(ms / 3600000); return { big: String(h), label: h === 1 ? 'hour to go' : 'hours to go' }; }
    return { big: 'Fore', label: "It's golf day" };
  }
  return { big: 'Final', label: 'See the scoreboard' };
}
function weatherTip(w) {
  const tips = [];
  if (w.gust >= 30 || w.wind >= 20) tips.push('Strong wind off the water: club up into it, keep the ball low, and aim away from trouble.');
  else if (w.wind >= 12 || w.gust >= 22) tips.push('Breezy: take an extra club into the wind and favor the middle of the greens.');
  else tips.push('Light wind: good scoring conditions, so attack pins you trust.');
  if (w.temp < 50) tips.push('Cool air carries the ball shorter, so add a club on approach shots.');
  if (w.rain >= 40) tips.push('Rain is likely: bring a towel and dry gloves.');
  return tips.join(' ');
}
function agoText(ts) {
  if (!ts) return '';
  const min = Math.floor((Date.now() - ts) / 60000);
  if (min < 1) return 'just now';
  if (min === 1) return '1 min ago';
  return min + ' min ago';
}

        ${changed ? `<div class="r">After saving<br>${esc(tallyLine(after))}</div>` : ''}
      </div>
      <button type="button" class="save" data-act="save"${sel ? '' : ' disabled'}>Save hole ${hole}</button>
      ${last ? `<div class="undo"><span>Hole ${last.hole} saved ${esc(agoText(last.ts))}</span><button type="button" data-act="undo" data-m="${mid}">Undo</button></div>` : ''}
    </div>`;
}

// ---------- Rankings ----------
function rankRow(p) {
  const pl = PLAYERS[p.id];
  const t = pl.team === 'D' ? 'd' : 'l';
  const note = esc(p.note).replace(/\*(.+?)\*/g, '<em>$1</em>');
  return `<div class="rank"><div class="rnum ${t}" aria-label="Rank ${p.rank}">${p.rank}</div>
    <div style="flex:1;min-width:0"><div class="rname">${esc(p.name)}<span class="rteam ${t}">${NAMES[pl.team]}</span></div><div class="rnote">${note}</div></div></div>`;
}
function rankingsBody() {
  if (RANKINGS.length) {
    return RANKINGS.map((t) => `<section aria-label="${esc(t.title)}"><h2 class="tierh">${esc(t.title)}</h2>
      ${t.blurb ? `<p class="tierb">${esc(t.blurb)}</p>` : '<div style="height:12px"></div>'}
      <div class="card ranklist">${t.players.map(rankRow).join('')}</div></section>`).join('');
  }
  const url = CONFIG.rankingsDocUrl;
  return url
    ? `<section class="card docframe"><div class="docbar">The 2026 Rankings</div><iframe src="${esc(url)}" title="Hart's Rankings" loading="lazy"></iframe></section>
       <a class="btnlink" href="${esc(url)}" target="_blank" rel="noopener">Open in a new tab</a>`
    : `<section class="card docframe"><div class="docbar">The 2026 Rankings</div>
        <div class="p16" style="padding:20px 16px"><div style="font-size:18px;font-weight:800">Hart's rankings land here before the first tee.</div>
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:16px"><div class="bar" style="width:100%"></div><div class="bar" style="width:94%"></div><div class="bar" style="width:98%"></div><div class="bar" style="width:60%"></div></div></div></section>`;
}
function viewRankings() {
  return `<header class="pad top"><div class="eyebrow">The annual write-up</div><h1>Hart's Rankings</h1>
    <div class="sub">Every golfer in the field, ranked and roasted by Hart Zeitler.</div></header>
    <div class="stack" style="gap:24px">${rankingsBody()}</div>`;
}

// ---------- Kalshi Korner ----------
function propCard(p) {
  const st = (state.props[p.id] && state.props[p.id].status) || null;
  const settleBtns = p.ou
    ? [['over', 'Over'], ['under', 'Under']]
    : [['hit', 'Hit'], ['miss', 'Miss']];
  const resultLabel = st ? (settleBtns.find((b) => b[0] === st) || [st, st])[1] : '';
  const yes = p.ou ? `Over ${p.line} · 50¢` : `Yes ${p.yes}¢`;
  const no = p.ou ? `Under ${p.line} · 50¢` : `No ${p.no}¢`;
  const info = p.ou ? 'Even money' : `Implied chance ${p.pct}%`;
  return `<section class="card prop">
    <div class="row between" style="align-items:flex-start;gap:12px">
      <div><div class="ttl">${esc(p.title)}</div>${p.sub ? `<div class="psub">${esc(p.sub)}</div>` : ''}</div>
      <div class="odds">${esc(p.badge)}</div>
    </div>
    <div class="row" style="gap:10px;margin-top:14px"><div class="px yes">${esc(yes)}</div><div class="px no">${esc(no)}</div></div>
    <div class="row between" style="margin-top:10px;gap:8px">
      ${st ? `<span class="result${st === 'miss' || st === 'under' ? ' no' : ''}">${esc(resultLabel)}</span>` : `<span style="font-size:12px;font-weight:600;color:var(--mut)">${info} · Open</span>`}
      <span class="row" style="gap:8px">${st
        ? `<button type="button" class="settle" data-act="reopen" data-id="${p.id}">Reopen</button>`
        : settleBtns.map(([v, l]) => `<button type="button" class="settle" data-act="settle" data-id="${p.id}" data-val="${v}">${l}</button>`).join('')}</span>
    </div>
  </section>`;
}
function viewKalshi() {
  return `<header class="pad top"><div class="eyebrow">For entertainment only</div><h1>Kalshi Korner</h1>
    <div class="sub">Joke prop bets for the weekend. No real money, just reputations.</div></header>
    <div class="stack" style="gap:14px">${PROPS.map(propCard).join('')}
      <div class="more">More props coming</div>
      <p class="foot">Not affiliated with Kalshi. Prices are the odds converted to cents. Hit and Miss settle a prop for everyone.</p></div>`;
}

// ---------- Router and render ----------
function parseRoute() { return (location.hash || '#/tee').replace(/^#\/?/, '').split('/'); }
function render() {
  const [name, a, b] = parseRoute();
  let html, active = name;
  switch (name) {
    case 'score': html = viewScore(); break;
    case 'strokes': html = viewStrokes(); active = 'score'; break;
    case 'record': html = viewRecord(a, parseInt(b, 10)); active = 'score'; break;
    case 'rankings': html = viewRankings(); break;
    case 'kalshi': html = viewKalshi(); break;
    default: html = viewTee(); active = 'tee';
  }
  const warn = state.error ? `<div class="warn" role="alert">Live scoring can't connect right now. Check your signal. Results won't sync until it's back.</div>` : '';
  viewEl.innerHTML = warn + html;
  renderNav(active);
}
function onRouteChange() {
  const [name, a, b] = parseRoute();
  if (name === 'record') {
    const hole = parseInt(b, 10);
    if (state.rec.m !== a || state.rec.hole !== hole) state.rec = { m: a, hole, sel: null, touched: false };
  }
  render();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', onRouteChange);

// ---------- Writes ----------
function saveHole(mid, hole, val) {
  const prev = holesOf(state.results[mid])[hole] || null;
  return fb.setDoc(fb.doc(fb.db, 'results', mid), { ['h' + hole]: val, last: { hole, prev, ts: Date.now() } }, { merge: true });
}
function undoLast(mid) {
  const last = state.results[mid] && state.results[mid].last;
  if (!last) return Promise.resolve();
  return fb.setDoc(fb.doc(fb.db, 'results', mid), { ['h' + last.hole]: last.prev ? last.prev : fb.deleteField(), last: fb.deleteField() }, { merge: true });
}
function setProp(id, val) {
  return fb.setDoc(fb.doc(fb.db, 'props', id), { status: val ? val : fb.deleteField() }, { merge: true });
}
function offlineToast() { toast("Live scoring isn't connected. Check your signal and try again."); }

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'pick') {
    state.rec.sel = el.dataset.val; state.rec.touched = true; render();
  } else if (act === 'save') {
    const { m, hole } = state.rec;
    const holes = holesOf(state.results[m]);
    const sel = state.rec.touched ? state.rec.sel : (holes[hole] || null);
    if (!sel) return;
    if (sel !== holes[hole]) {
      if (!fb) { offlineToast(); return; }
      saveHole(m, hole, sel).catch((err) => { console.error(err); toast("Couldn't save hole " + hole + '. Try again.'); });
      toast('Hole ' + hole + ' saved');
    }
    const next = Math.min(hole + 1, 18);
    if (next === hole) { state.rec.touched = false; render(); }
    else location.hash = '#/record/' + m + '/' + next;
  } else if (act === 'undo') {
    if (!fb) { offlineToast(); return; }
    const last = state.results[el.dataset.m] && state.results[el.dataset.m].last;
    undoLast(el.dataset.m).catch((err) => { console.error(err); toast("Couldn't undo. Try again."); });
    if (last) toast('Undid hole ' + last.hole);
    state.rec.touched = false;
  } else if (act === 'settle' || act === 'reopen') {
    if (!fb) { offlineToast(); return; }
    setProp(el.dataset.id, act === 'settle' ? el.dataset.val : null).catch((err) => { console.error(err); toast("Couldn't update the prop. Try again."); });
  }
});

// ---------- Live data ----------
async function initFirebase() {
  try {
    const [appMod, storeMod] = await Promise.all([import(FB_APP_URL), import(FB_STORE_URL)]);
    const app = appMod.initializeApp(firebaseConfig);
    const db = storeMod.getFirestore(app);
    fb = { db, doc: storeMod.doc, setDoc: storeMod.setDoc, deleteField: storeMod.deleteField };
    const listen = (name, key) => storeMod.onSnapshot(storeMod.collection(db, name), (snap) => {
      const next = {};
      snap.forEach((d) => { next[d.id] = d.data(); });
      state[key] = next; state.error = false; render();
    }, (err) => { console.error(err); state.error = true; render(); });
    listen('results', 'results');
    listen('props', 'props');
  } catch (err) {
    console.error(err);
    state.error = true; render();
  }
}

async function loadWeather() {
  const d = CONFIG.eventDate, { lat, lon } = CONFIG.coords;
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
      `&hourly=temperature_2m,precipitation_probability,wind_speed_10m,wind_gusts_10m` +
      `&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&wind_speed_unit=mph` +
      `&timezone=America%2FNew_York&start_date=${d}&end_date=${d}`;
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const i = j.hourly.time.indexOf(d + 'T10:00');
    if (i < 0) throw new Error('No 10 AM hour in forecast');
    const win = (arr) => arr.slice(i, i + 6).filter((x) => x != null);
    state.weather = {
      temp: Math.round(j.hourly.temperature_2m[i]),
      wind: Math.round(j.hourly.wind_speed_10m[i]),
      gust: Math.round(Math.max(...win(j.hourly.wind_gusts_10m))),
      rain: Math.round(Math.max(...win(j.hourly.precipitation_probability))),
      hi: Math.round(j.daily.temperature_2m_max[0]),
      lo: Math.round(j.daily.temperature_2m_min[0])
    };
    state.weatherErr = false;
  } catch (err) {
    console.error(err);
    state.weatherErr = true;
  }
  if (parseRoute()[0] === 'tee' || !location.hash) render();
}

onRouteChange();
initFirebase();
loadWeather();
setInterval(loadWeather, 30 * 60 * 1000);
</script>
</body>
